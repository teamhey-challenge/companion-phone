name: record-snapshots

# Records Paparazzi snapshots on CI and pushes the changed PNGs back to the branch as ONE commit.
# Trigger: add the `record-snapshots` label to a same-repo PR, or run manually with a branch name.
on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to record on (snapshot PNGs are committed to it)
        required: true

concurrency:
  group: record-snapshots-${{ github.event.pull_request.head.ref || inputs.branch }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  record:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.label.name == 'record-snapshots' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BRANCH: ${{ github.event.pull_request.head.ref || inputs.branch }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Guard - never record on main
        run: |
          if [ -z "$BRANCH" ] || [ "$BRANCH" = "main" ] || [ "$BRANCH" = "$DEFAULT_BRANCH" ]; then
            echo "::error::record-snapshots refuses to run on '${BRANCH:-<empty>}' (main/default branch). Run it on a PR branch; snapshot PNGs reach main only through a reviewed PR."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}
      - name: Checkout shared submodule (read-only deploy key)
        env:
          SHARED_SSH_KEY: ${{ secrets.SHARED_SSH_KEY }}
        run: |
          key="$RUNNER_TEMP/shared_key"
          (umask 077; printf '%s\n' "$SHARED_SSH_KEY" > "$key")
          ssh-keyscan github.com > "$RUNNER_TEMP/known_hosts" 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o UserKnownHostsFile=$RUNNER_TEMP/known_hosts -o StrictHostKeyChecking=yes"
          git -c url.git@github.com:.insteadOf=https://github.com/ submodule update --init --recursive
          rm -f "$key"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: Record Paparazzi snapshots (all modules)
        run: nice -n 19 ./gradlew --max-workers=2 recordPaparazziDebug
      - name: Commit and push changed snapshots
        run: |
          # Stage everything, then unstage whatever is not a snapshot (a pathspec fails when no snapshot is tracked yet).
          git add -A
          git diff --cached --name-only -z | { grep -zv '/src/test/snapshots/' || true; } | xargs -0 -r git reset -q --
          if git diff --cached --quiet; then echo "no snapshot changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "snapshots: record on CI"
          git push origin "HEAD:refs/heads/$BRANCH"
          # Pushes made with GITHUB_TOKEN do not trigger pull_request runs; start the gate on the new head explicitly.
          gh workflow run ci.yml --ref "$BRANCH"
      - name: Remove label
        if: github.event_name == 'pull_request' && always()
        run: gh pr edit ${{ github.event.pull_request.number }} --remove-label record-snapshots || true
